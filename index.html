<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8eaed;
  }
  .box { text-align: center; }
  .spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 18px;
    border: 4px solid rgba(255, 255, 255, .15);
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 15px; opacity: .8; letter-spacing: .3px; }
  a { color: #4f8cff; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Redirecting you, please wait…</p>
    <p id="fallback" style="display: none; margin-top: 12px;">
      Taking too long? <a id="link" href="#">Click here</a>
    </p>
  </div>

<script>
(function () {
  // Destination is stored encoded so it is not plainly readable in the source
  var target = atob("aHR0cHM6Ly93d3cueW91dHViZS5jb20vd2F0Y2g/dj1RRGlhM2UxMmN6Yw==");

  // Manual fallback link
  document.getElementById("link").href = target;

  // Show fallback link if redirect is delayed
  setTimeout(function () {
    document.getElementById("fallback").style.display = "block";
  }, 1500);

  // Send notification to ntfy in the background, then redirect regardless of outcome
  function redirect() {
    window.location.replace(target);
  }

  try {
    fetch('https://ntfy.sh/2026rickrollhalol', {
      method: 'POST',
      body: 'The page was opened. Redirecting to destination.',
      headers: {
        'Title': 'Page Visit',
        'Priority': 'default',
        'Tags': 'eyes'
      }
    })
      .then(function () { redirect(); })
      .catch(function () { redirect(); });
  } catch (e) {
    redirect();
  }
})();
</script>
</body>
</html>
